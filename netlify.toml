[build]
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/billing/checkout"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/billing/portal"
  to = "/.netlify/functions/create-customer-portal"
  status = 200

[[redirects]]
  from = "/api/billing/sync"
  to = "/.netlify/functions/sync-billing-status"
  status = 200

[[redirects]]
  from = "/api/jobs/promote"
  to = "/.netlify/functions/promote-job"
  status = 200

[[redirects]]
  from = "/api/analytics/page-view"
  to = "/.netlify/functions/track-page-view"
  status = 200

[[redirects]]
  from = "/api/indexing/job"
  to = "/.netlify/functions/notify-google-indexing"
  status = 200

[[redirects]]
  from = "/api/indexing/backfill-jobs"
  to = "/.netlify/functions/backfill-google-indexing-jobs"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/eliminar-cuenta"
  to = "/eliminar-cuenta/"
  status = 301

[[redirects]]
  from = "/eliminar-cuenta/"
  to = "/eliminar-cuenta/index.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacidad/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terminos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terminos/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sitemap-jobs.xml"
  to = "/.netlify/functions/sitemap-jobs"
  status = 200

[[redirects]]
  from = "/vacantes/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/vacantes/styles.css"
  to = "/styles.css"
  status = 200

[[redirects]]
  from = "/vacantes/app.js"
  to = "/app.js"
  status = 200

[[redirects]]
  from = "/vacantes/config.js"
  to = "/config.js"
  status = 200

[[redirects]]
  from = "/vacantes/admin-report-viewer.js"
  to = "/admin-report-viewer.js"
  status = 200

[[redirects]]
  from = "/vacantes/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/vacantes/*"
  to = "/.netlify/functions/job-page"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://app.trysoro.com; img-src 'self' data: blob: https://app.trysoro.com https://*.supabase.co; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://app.trysoro.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://gaia.inegi.org.mx https://app.trysoro.com; form-action 'self' mailto:; upgrade-insecure-requests"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin-report-viewer.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/blog/blog.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap-pages.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap-jobs.xml"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
